# sample properties for access to the "develop" test server - put into your home directory
# cited host and credentials are not real ones - replace with your own!

# components of the URL to access the t9t server's /login and /rpc endpoints
t9t.schema=http
t9t.host=enterYourHostnameHere
t9t.port=8825
# alternate way to specify the full path to the t9t server (overrides schema, host and port), preferred if only one server is used
t9t.url=http://enterYourHostnameHere:8825/somePath
# API key to use for this connection
t9t.apiKey=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee

# credentials (user ID / password)
t9t.userId=admin
t9t.password=secretApplicationPassword

# URL of the REST API (Jakarta-RS) of the t9t server
t9t.rest.url=https://gateway.enterYourHostnameHere/rest
# API key to use for this connection
t9t.rest.apiKey=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
