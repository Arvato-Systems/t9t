services:
  npm-registry:
    image: verdaccio/verdaccio:6.1.6
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - npm-storage:/verdaccio/storage
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4873/-/ping >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  maven-repository:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ../target/local-maven-repository:/usr/share/nginx/html/repository:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/repository/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
